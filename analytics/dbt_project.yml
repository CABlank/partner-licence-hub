name: licence_hub
version: "1.0.0"
profile: licence_hub

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Días después de caducar en los que una suscripción sigue contando en el ARR.
  # Quien renueva 10 días tarde no es una baja seguida de un alta.
  arr_grace_days: 30

models:
  licence_hub:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  licence_hub:
    +schema: reference
